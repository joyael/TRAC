<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login </title>
    {% load static %}
</head>
<body>

    {% if messages %}
    <ul>
    {% for message in messages %}
        <li>{{ message }}</li>
    {% endfor %}
    </ul>
    {% endif %}

    <h1>Login </h1>

    <form method="post" action="{% url 'login' %}">

        {% csrf_token %}

        {{ form.as_p }}  <!-- Renders the form fields, including the select for role -->

        <button type="submit">Login</button>

    </form>
    <div id="response"></div>
</body>
</html>
