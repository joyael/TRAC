<!-- product_list.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    {% load static %}
    <script src="{% static 'js/token_refreshing.js' %}"></script>
</head>
<body>
    <h1>Product List</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Tag</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>{{ product.tag }}</td>
                <td>{{ product.price }}</td>
                <td>
                    <a href="{% url 'updateproduct' product.id %}">Update</a>
                </td>
                <td>
                    <a href="{% url 'deleteproduct' product.id %}" 
                    onclick="return confirm('Are you sure you want to delete this product?');">
                    Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No products available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
